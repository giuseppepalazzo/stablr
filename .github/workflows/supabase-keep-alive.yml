name: Supabase Keep Alive

on:
  schedule:
    # Daily UTC gate only; database activity runs every five continuous days.
    # Do not use */5 in day-of-month: it resets at each month boundary.
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check five-day interval
        id: interval
        shell: bash
        env:
          RUN_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          UTC_DAY=$(( $(date -u +%s) / 86400 ))

          if [[ "${RUN_EVENT_NAME}" == "workflow_dispatch" ]] || (( UTC_DAY % 5 == 0 )); then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Five-day interval not due; no Supabase request."
          fi

      - name: Generate read-only database activity
        if: steps.interval.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}/rest/v1/fig_clubs"

          for request in 1 2 3; do
            ENDPOINT="${BASE_URL}?select=id&limit=1"
            RESPONSE_FILE="/tmp/supabase-keep-alive-${request}.json"
            echo "Calling read-only request ${request}/3"

            HTTP_CODE=$(curl --silent --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              "${ENDPOINT}")

            if [ "${HTTP_CODE}" != "200" ]; then
              echo "Supabase keep-alive failed with HTTP ${HTTP_CODE} on request ${request}/3"
              cat "${RESPONSE_FILE}" || true
              exit 1
            fi
          done

          echo "Supabase keep-alive ok: 3 read-only database requests completed"
